<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#E8D9FF" />
        <meta
            name="description"
            content="Mioura – jouw persoonlijke migrainejournaal"
        />
        <link rel="manifest" href="manifest.json" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <link rel="stylesheet" href="css/custom.css" />
        <title>Mioura – Migrainejournaal</title>
    </head>
    <body>
        <div id="app" class="app-shell">
            <header class="topbar">
                <a
                    class="brand"
                    href="#"
                    data-page="dashboard"
                    aria-label="Mioura startpagina"
                >
                    <span class="brand-mark">m</span><span>mioura</span>
                </a>
                <span class="today" id="todayLabel"></span>
            </header>
            <main id="view" class="view" aria-live="polite"></main>
            <nav class="bottom-nav" aria-label="Hoofdnavigatie">
                <button data-page="dashboard" class="nav-item active">
                    <span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-house preview-icon"
                        >
                            <path
                                d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"
                            />
                            <path
                                d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                            />
                        </svg> </span
                    ><small>Home</small>
                </button>
                <button data-page="register" class="nav-item">
                    <span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-circle-plus preview-icon"
                        >
                            <circle cx="12" cy="12" r="10" />
                            <path d="M8 12h8" />
                            <path d="M12 8v8" />
                        </svg> </span
                    ><small>Registreren</small>
                </button>
                <button data-page="calendar" class="nav-item">
                    <span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-calendar-days preview-icon"
                        >
                            <path d="M8 2v3" />
                            <path d="M16 2v3" />
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <path d="M3 9h18" />
                            <path d="M8 13h.01" />
                            <path d="M12 13h.01" />
                            <path d="M16 13h.01" />
                            <path d="M8 17h.01" />
                            <path d="M12 17h.01" />
                            <path d="M16 17h.01" />
                        </svg> </span
                    ><small>Kalender</small>
                </button>
                <button data-page="medication" class="nav-item">
                    <span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-pill preview-icon"
                        >
                            <path
                                d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"
                            />
                            <path d="m8.5 8.5 7 7" />
                        </svg> </span
                    ><small>Medicatie</small>
                </button>
                <button data-page="insights" class="nav-item">
                    <span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-chart-column-big preview-icon"
                        >
                            <path d="M3 3v16a2 2 0 0 0 2 2h16" />
                            <rect x="15" y="5" width="4" height="12" rx="1" />
                            <rect x="7" y="8" width="4" height="9" rx="1" />
                        </svg> </span
                    ><small>Inzichten</small>
                </button>
                <button data-page="settings" class="nav-item">
                    <span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-cog preview-icon"
                        >
                            <path d="M11 10.27 7 3.34" />
                            <path d="m11 13.73-4 6.93" />
                            <path d="M12 22v-2" />
                            <path d="M12 2v2" />
                            <path d="M14 12h8" />
                            <path d="m17 20.66-1-1.73" />
                            <path d="m17 3.34-1 1.73" />
                            <path d="M2 12h2" />
                            <path d="m20.66 17-1.73-1" />
                            <path d="m20.66 7-1.73 1" />
                            <path d="m3.34 17 1.73-1" />
                            <path d="m3.34 7 1.73 1" />
                            <circle cx="12" cy="12" r="2" />
                            <circle cx="12" cy="12" r="8" />
                        </svg> </span
                    ><small>Instellingen</small>
                </button>
            </nav>
        </div>
        <div id="modal-root"></div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/data-manager.js"></script>
        <script src="js/onboarding.js"></script>
        <script src="js/migraine.js"></script>
        <script src="js/medication.js"></script>
        <script src="js/calendar.js"></script>
        <script src="js/analytics.js"></script>
        <script src="js/import-export.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
